<!DOCTYPE html>
<html lang="da">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center;
      -webkit-user-select: none; user-select: none;
    }
    .label { color: #aaa; font-size: 15px; }
    #timer { font-size: 44px; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
    #since { color: #aaa; font-size: 14px; margin-bottom: 36px; }
    .km-row { display: flex; align-items: center; gap: 20px; margin: 6px 0 14px; }
    #km { font-size: 96px; font-weight: 700; min-width: 2.2ch; font-variant-numeric: tabular-nums; }
    .step {
      width: 64px; height: 64px; border-radius: 50%; border: 0;
      background: #2a2a2a; color: #fff; font-size: 34px; line-height: 1;
    }
    input[type=range] { width: 100%; max-width: 420px; height: 40px; accent-color: #d50000; }
    .ticks { display: flex; justify-content: space-between; width: 100%; max-width: 420px; color: #777; font-size: 13px; margin-bottom: 36px; }
    #save {
      width: 100%; max-width: 420px; padding: 22px; border: 0; border-radius: 16px;
      background: #d50000; color: #fff; font-size: 24px; font-weight: 700;
    }
    #save:disabled { opacity: .5; }
    #restart { margin-top: 18px; background: none; border: 0; color: #888; font-size: 15px; text-decoration: underline; }
    #msg { margin-top: 20px; min-height: 1.4em; font-size: 17px; }
    .ok { color: #7ee787; } .err { color: #ff7b72; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading" class="label">Starter…</div>

  <div id="main" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="label">Tid</div>
    <div id="timer">0:00</div>
    <div id="since"></div>

    <div class="label">Km</div>
    <div class="km-row">
      <button class="step" id="minus" aria-label="Færre km">−</button>
      <div id="km">12</div>
      <button class="step" id="plus" aria-label="Flere km">+</button>
    </div>
    <input type="range" id="slider" min="5" max="20" step="1" value="12">
    <div class="ticks"><span>5</span><span>20</span></div>

    <button id="save">Gem</button>
    <button id="restart">Start tiden forfra</button>
  </div>

  <div id="done" class="hidden">
    <div style="font-size:64px">✓</div>
    <div id="doneTitle" style="font-size:22px;margin:8px 0 30px"></div>
    <button id="again" class="step" style="width:auto;height:auto;border-radius:12px;padding:14px 24px;font-size:18px">Ny træning</button>
  </div>

  <div id="msg"></div>

  <script>
    var startMs = null, offset = 0, tick = null;
    var $ = function (id) { return document.getElementById(id); };

    function show(id) {
      ['loading', 'main', 'done'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); });
    }
    function msg(text, cls) { $('msg').textContent = text || ''; $('msg').className = cls || ''; }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function setKm(v) {
      v = Math.max(5, Math.min(20, v));
      $('km').textContent = v;
      $('slider').value = v;
    }

    function render() {
      var s = Math.max(0, Math.floor((Date.now() + offset - startMs) / 1000));
      var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
      $('timer').textContent = (h ? h + ':' + pad(m) : m) + ':' + pad(sec);
    }

    function onState(st) {
      startMs = st.start;
      offset = st.now - Date.now();
      var d = new Date(startMs);
      $('since').textContent = 'Startet kl. ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      setKm(st.defaultKm);
      $('save').disabled = false;
      msg('');
      show('main');
      clearInterval(tick); tick = setInterval(render, 1000); render();
    }

    function onError(e) {
      $('save').disabled = false;
      msg('Fejl: ' + (e && e.message ? e.message : e), 'err');
    }

    function load() {
      show('loading');
      google.script.run.withSuccessHandler(onState).withFailureHandler(onError).getState();
    }

    $('slider').addEventListener('input', function () { setKm(Number(this.value)); });
    $('minus').addEventListener('click', function () { setKm(Number($('slider').value) - 1); });
    $('plus').addEventListener('click', function () { setKm(Number($('slider').value) + 1); });

    $('save').addEventListener('click', function () {
      $('save').disabled = true;
      msg('Gemmer…');
      google.script.run
        .withSuccessHandler(function (r) {
          clearInterval(tick);
          $('doneTitle').textContent = r.title;
          msg('Gemt i kalenderen', 'ok');
          show('done');
        })
        .withFailureHandler(onError)
        .save(Number($('slider').value));
    });

    $('restart').addEventListener('click', function () {
      if (!confirm('Start tiden forfra fra nu?')) return;
      google.script.run.withSuccessHandler(onState).withFailureHandler(onError).restart();
    });

    $('again').addEventListener('click', load);

    load();
  </script>
</body>
</html>
