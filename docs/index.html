<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Træning</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Træning">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <style>
    * { box-sizing: border-box; }
    html, body { background: #111; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .screen { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
    .label { color: #aaa; font-size: 15px; }
    #timer { font-size: 44px; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
    #since { color: #aaa; font-size: 14px; margin-bottom: 36px; }
    .km-row { display: flex; align-items: center; gap: 20px; margin: 6px 0 14px; }
    #km { font-size: 96px; font-weight: 700; min-width: 2.2ch; font-variant-numeric: tabular-nums; }
    .step {
      width: 64px; height: 64px; border-radius: 50%; border: 0;
      background: #2a2a2a; color: #fff; font-size: 34px; line-height: 1;
    }
    input[type=range] { width: 100%; height: 40px; accent-color: #d50000; }
    .ticks { display: flex; justify-content: space-between; width: 100%; color: #777; font-size: 13px; margin-bottom: 36px; }
    .big {
      width: 100%; padding: 22px; border: 0; border-radius: 16px;
      background: #d50000; color: #fff; font-size: 24px; font-weight: 700;
    }
    .big:disabled { opacity: .5; }
    .link { margin-top: 18px; background: none; border: 0; color: #888; font-size: 15px; text-decoration: underline; }
    #msg { margin-top: 20px; min-height: 1.4em; font-size: 17px; }
    .ok { color: #7ee787; } .err { color: #ff7b72; }
    .hidden { display: none !important; }
    textarea {
      width: 100%; height: 110px; margin: 16px 0 20px; padding: 12px; border-radius: 12px;
      border: 1px solid #444; background: #1c1c1c; color: #fff; font-size: 15px;
      -webkit-user-select: text; user-select: text;
    }
    #check { font-size: 72px; line-height: 1; color: #7ee787; }
    #doneTitle { font-size: 26px; font-weight: 700; margin: 12px 0 8px; }
  </style>
</head>
<body>
  <div id="loading" class="screen label">Starter…</div>

  <div id="setup" class="screen hidden">
    <div style="font-size:22px;font-weight:700">Opsætning</div>
    <div class="label" style="margin-top:8px">Indsæt din Google Apps Script web-app-URL<br>(den der slutter på <b>/exec</b>)</div>
    <textarea id="urlInput" placeholder="https://script.google.com/macros/s/…/exec"></textarea>
    <button id="saveUrl" class="big">Gem</button>
  </div>

  <div id="main" class="screen hidden">
    <div class="label">Tid</div>
    <div id="timer">0:00</div>
    <div id="since"></div>

    <div class="label">Km</div>
    <div class="km-row">
      <button class="step" id="minus" aria-label="Færre km">−</button>
      <div id="km">12</div>
      <button class="step" id="plus" aria-label="Flere km">+</button>
    </div>
    <input type="range" id="slider" min="5" max="20" step="1" value="12">
    <div class="ticks"><span>5</span><span>20</span></div>

    <button id="save" class="big">Gem</button>
    <button id="restart" class="link">Start tiden forfra</button>
  </div>

  <div id="done" class="screen hidden">
    <div id="check">✓</div>
    <div id="doneTitle"></div>
    <div class="label">er gemt i kalenderen.<br>Du kan bare lukke appen.</div>
    <button id="again" class="link" style="margin-top:40px">Start ny træning</button>
  </div>

  <div id="msg"></div>
  <button id="retry" class="link hidden">Prøv igen</button>
  <button id="settings" class="link hidden" style="font-size:13px">Skift URL</button>

  <script>
    var URL_KEY = 'backendUrl';
    var startMs = null, offset = 0, tick = null, current = 'loading', lastLoad = 0;
    var $ = function (id) { return document.getElementById(id); };

    function backendUrl() { try { return localStorage.getItem(URL_KEY) || ''; } catch (e) { return ''; } }

    function show(id) {
      current = id;
      ['loading', 'setup', 'main', 'done'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); });
      $('settings').classList.toggle('hidden', id === 'setup' || id === 'loading');
    }
    function msg(text, cls) { $('msg').textContent = text || ''; $('msg').className = cls || ''; }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function api(action, extra) {
      var body = Object.assign({ action: action }, extra || {});
      // text/plain undgår CORS-preflight, som Apps Script ikke understøtter
      return fetch(backendUrl(), { method: 'POST', body: JSON.stringify(body), redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) { if (!d.ok) throw new Error(d.error || 'Ukendt fejl'); return d; });
    }

    function setKm(v) {
      v = Math.max(5, Math.min(20, v));
      $('km').textContent = v;
      $('slider').value = v;
    }

    function render() {
      var s = Math.max(0, Math.floor((Date.now() + offset - startMs) / 1000));
      var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
      $('timer').textContent = (h ? h + ':' + pad(m) : m) + ':' + pad(sec);
    }

    function onState(st, keepKm) {
      startMs = st.start;
      offset = st.now - Date.now();
      var d = new Date(startMs);
      $('since').textContent = 'Startet kl. ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      if (!keepKm) setKm(st.defaultKm);
      $('save').disabled = false;
      msg(''); $('retry').classList.add('hidden');
      show('main');
      clearInterval(tick); tick = setInterval(render, 1000); render();
    }

    function onError(e) {
      $('save').disabled = false;
      msg('Fejl: ' + (e && e.message ? e.message : e), 'err');
      $('retry').classList.remove('hidden');
    }

    function load() {
      if (!backendUrl()) { show('setup'); return; }
      var keepKm = current === 'main';
      if (!keepKm) show('loading');
      lastLoad = Date.now();
      api('state').then(function (st) { onState(st, keepKm); }).catch(function (e) {
        if (current === 'loading') { show('main'); $('timer').textContent = '–'; $('save').disabled = true; }
        onError(e);
      });
    }

    $('slider').addEventListener('input', function () { setKm(Number(this.value)); });
    $('minus').addEventListener('click', function () { setKm(Number($('slider').value) - 1); });
    $('plus').addEventListener('click', function () { setKm(Number($('slider').value) + 1); });

    $('save').addEventListener('click', function () {
      $('save').disabled = true;
      msg('Gemmer…');
      api('save', { km: Number($('slider').value) }).then(function (r) {
        clearInterval(tick);
        $('doneTitle').textContent = r.title;
        msg('');
        show('done');
      }).catch(onError);
    });

    $('restart').addEventListener('click', function () {
      if (!confirm('Start tiden forfra fra nu?')) return;
      api('restart').then(function (st) { onState(st, true); }).catch(onError);
    });

    $('again').addEventListener('click', load);
    $('retry').addEventListener('click', function () { msg(''); $('retry').classList.add('hidden'); load(); });

    $('settings').addEventListener('click', function () {
      $('urlInput').value = backendUrl();
      show('setup');
    });
    $('saveUrl').addEventListener('click', function () {
      var u = $('urlInput').value.trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { msg('URL\'en skal starte med https://script.google.com/ og slutte på /exec', 'err'); return; }
      try { localStorage.setItem(URL_KEY, u); } catch (e) {}
      msg('');
      current = 'loading';
      load();
    });

    // Når appen hentes frem igen fra baggrunden: start ny træning efter "Gemt",
    // ellers opdatér tiden fra serveren.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible' || !backendUrl()) return;
      if (current === 'done' || (current === 'main' && Date.now() - lastLoad > 30000)) {
        if (current === 'done') current = 'loading';
        load();
      }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    load();
  </script>
</body>
</html>
